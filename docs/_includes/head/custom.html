<style>

.follow-dropdown{ position:relative; display:inline-block; }
.follow-btn{
  display:inline-flex; align-items:center; gap:.5rem;
  padding:.45rem .9rem; border:1px solid #cfd4dc; border-radius:.6rem;

}
