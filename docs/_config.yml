# Sitio básico
theme: minima
baseurl: "/Javier-6-months-projects" # importante para rutas correctas
url: "https://jnapfx.github.io"
tittle: "Home"
# Navegación del header
header_pages:
  - index.md
  - projects.md
  - main_project.md
  - gallery.md

# Autor
author:
  name: Javier Napoles
  email: jnapfx@gmail.com

# BRANDING
# =====================
logo: "/assets/img/dae_logo.png" # 

# =====================
# PLUGINS (safe + GitHub Pages supported)
# =====================
plugins:
    - jekyll-feed
    - jekyll-seo-tag
    - jekyll-include-cache
    - jekyll-remote-theme

# =====================
# BUILD & MARKDOWN
# =====================
markdown: kramdown
highlighter: rouge
permalink: pretty

