# =====================
# SITE BASICS
# =====================
title: "Javier Napoles — SOC Analyst & Graphic Designer"
description: "Portfolio showcasing SOC Labs projects, and case studies."
url: "https://jnapfx.github.io" # ← Your actual GitHub username
baseurl: "/Javier-6-months-projects" # ← Subdirectory path for theme1

# =====================
# THEME (Modern)
# =====================
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

# =====================
# AUTHOR PROFILE
# =====================
author:
    name: "Javier Napoles"
    avatar: "/assets/img/pinky.jpg" # ← Fixed from .heic
    bio: "Graphic designer turning into SOC Analyst."
    email: "jnapfx@gmail.com"
    links:
        - label: "GitHub"
          icon: "fab fa-github"
          url: "https://github.com/Jnapfx"
        - label: "LinkedIn"
          icon: "fab fa-linkedin"
          url: "https://www.linkedin.com/in/javier-napoles-3513031a7/"

# =====================
# NAVIGATION (top menu)
# =====================
# Navigation is configured in _data/navigation.yml for Minimal Mistakes theme

# =====================
# BRANDING
# =====================
logo: "/assets/img/dae-logo.jpg" # ← Fixed from .avif

# =====================
# PLUGINS (safe + GitHub Pages supported)
# =====================
plugins:
    - jekyll-feed
    - jekyll-seo-tag
    - jekyll-include-cache
    - jekyll-remote-theme

# =====================
# BUILD & MARKDOWN
# =====================
markdown: kramdown
highlighter: rouge
permalink: pretty

# =====================
# GLOBAL DEFAULTS (keeps layout consistent)
# =====================
# These defaults apply Minimal Mistakes' single-page layout with a sticky ToC.
# They won't break Minima; Minima ignores unknown front matter values.
defaults:
    - scope:
          path: ""
          type: "pages"
      values:
          layout: single
          toc: true
          toc_sticky: true
          author_profile: true

# =====================
# EXCLUDES (keep the build clean)
# =====================
# GitHub Pages handles these exclusions automatically
# exclude:
#     - README.md
#     - Gemfile
#     - Gemfile.lock
#     - .sass-cache/
#     - .jekyll-cache/
#     - gemfiles/
#     - node_modules/
#     - vendor/bundle/
#     - vendor/cache/
#     - vendor/gems/
#     - vendor/ruby/
